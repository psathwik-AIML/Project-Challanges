<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link rel="icon" href="./images/wallet.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="home.css">
</head>

<body>
    <!-- main container holding whole web page  -->
    <div class="mainBox">
        <!-- circle for decoration  -->
        <div class="circle"></div>
        <!-- top header  -->
        <div class="topHead">
            <h3>Expense Tracker <img src="./images/wallet.svg" alt="purse" width="40px"></h3>
            <button class="btn btn-lg" id="clickButton">click Here</button>
        </div>
        <!-- middle part  -->
        <div class="middlePart">
            <h4 class="m-0">Hello <img src="./images/hand wave.svg" width="35px" alt="hello">,Please Enter Your
                <br><span id="name">Name</span>
            </h4>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" placeholder="name">
                <label for="name">Name</label>
            </div>
            <a href="./tracker.html">
                <button class="btn btn-lg" id="loginButton">Login</button>
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
