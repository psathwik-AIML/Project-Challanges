<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tracker Table</title>
    <link rel="icon" href="./images/wallet.svg">
    <link rel="stylesheet" href="tracker.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- header part  -->
    <div class="header">
        <p class="m-0">Expense <br> Tracker</p> <img src="./images/wallet.svg" width="35px" alt="purse">
    </div>

    <!-- form  -->
    <div class="formBox">
        <div class="form-floating input">
            <input type="date" id="date" class="form-control" placeholder="date">
            <label for="date">Date</label>
        </div>
        <div class="form-floating input">
            <input type="text" id="amount" class="form-control" placeholder="amount">
            <label for="amount">Amount</label>
        </div>
        <select class="form-select input" aria-label="Default select example" id="transaction">
            <option selected>Transaction Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <button class="btn" id="plusButton" onclick="plusButton()">+</button>
    </div>

    <!-- cards  -->
    <div class="cards mt-4">
        <!-- card 1 -->
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Total Income <img src="./images/wallet.svg" width="35px"></h5>
                <h1><img src="./images/rupee symbol.svg" width="35px" alt=""> <span id="cardIncome">0</span></h1>
            </div>
        </div>
        <!-- card 2 -->
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Total Expense <img src="./images/wallet.svg" width="35px"></h5>
                <h1><img src="./images/rupee symbol.svg" width="35px" alt=""> <span id="cardExpense">0</span></h1>
            </div>
        </div>
        <!-- card 3 -->
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Total Balance <img src="./images/wallet.svg" width="35px"></h5>
                <h1><img src="./images/rupee symbol.svg" width="35px" alt=""> <span id="cardBalance">0</span></h1>
            </div>
        </div>
    </div>
    <!-- table data  -->
    <table class="trackTable mt-4">
        <tr id="first">
            <th>Amount</th>
            <th>Type</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
    </table>












    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
<script src="tracker.js"></script>

</html>
