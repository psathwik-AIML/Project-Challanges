<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Slider</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Image Slider</h1>
    <!-- container to wrap content  -->
    <div class="container">
      <img src="./Images/prev.png" alt="previous button" id="prev" />
      <!-- mail gallery  -->
      <div class="gallery">
        <!-- set 1  -->
        <div class="images-set">
          <img src="./Images/image-1.png" />
          <img src="./Images/image-2.png" />
          <img src="./Images/image-3.png" />
        </div>
        <!-- set 2  -->
        <div class="images-set">
          <img src="./Images/image-4.png" />
          <img src="./Images/image-5.png" />
          <img src="./Images/image-6.png" />
        </div>
        <!-- set 3 -->
        <div class="images-set">
          <img src="./Images/image-7.jpg" />
          <img src="./Images/image-8.jpg" />
          <img src="./Images/image-9.jpg" />
        </div>
        <!-- set 4  -->
        <div class="images-set">
          <img src="./Images/image-10.jpg" />
          <img src="./Images/image-11.jpg" />
          <img src="./Images/image-12.jpg" />
        </div>
      </div>
      <img src="./Images/next.png" alt="next button" id="next" />
    </div>
    <!-- js code  -->

    <script src="./script.js"></script>
  </body>
</html>
