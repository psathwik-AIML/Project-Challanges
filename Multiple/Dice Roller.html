<!DOCTYPE html>
<html>
    <head>
        <title>Dice Roller</title>
        <style>
            h1{
    background-color:rgb(112, 15, 15);
    font-size:60px;
    text-transform:capitalize;
    margin:0;
    padding:30px;
    text-shadow:2px 1px 4px orange ;
}
body{
    margin:0;
    background-color:rgba(18, 42, 85, 0.627);
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}
h3{
    text-align:center;
    font-size:30px;
    text-decoration:underline;
}
#container{
    text-align:center;
    font-weight:bold;
}
button{
    background-color:red;
    font-weight:bold;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
}
#input{
    font-size:40px;
    width:130px;
    text-align:center;
}
#result{
    text-align:center;
    margin:20px;
    font-weight:bold;
}
#images{
    text-align:center;
    font-weight:bold;
}
#images img{
    width:150px;
    margin:10px;
}
        </style>
    </head>
    <body>
        <h1>welcome to on board</h1>
        <h3 style="text-decoration: none;">DICE ROLLER</h3>
        <div id="container">
            <label>Num of Dices</label>
            <input type="number" value="1" min="1" id="input" >
            <button onclick="roll()">ROLL</button>
        </div> 
        <div id="result"></div>
        <div id="images"></div>
        
     <script >
        console.log("welcome to my world");
console.log("hunting begins from now");
//////////////////////////////////////////////
//////////////////////////////////////////////
console.log(".........................");
/////////////////////////////////////////////
function roll(){
    const numofdices=document.getElementById("input").value;
    const result=document.getElementById("result");
    const image=document.getElementById("images");
    const values=[];
    const images=[];
    for(let i=0;i<numofdices;i++){
        let value=Math.floor(Math.random()*6)+1;
        values.push(value);
        images.push(`<img src="images/${value}.png">`);
    }
    result.textContent=`Dices : ${values.join(' ')}`;
    image.innerHTML=` ${images.join('')}`;
}
     </script>
    </body>
</html>
