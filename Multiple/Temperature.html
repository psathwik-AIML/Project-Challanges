<!DOCTYPE html>
<html>
    <head>
        <title>TEMPERATURE APP</title>
        <style>
            h1{
    background-color:red;
    font-size:60px;
    text-transform:capitalize;
}
body{
    margin:0;
    background-color:rgba(128, 128, 128, 0.627);
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}
h3{
    text-align:center;
    font-size:30px;
    text-decoration:underline;
}
form{
    background-color:rgb(27, 27, 60);
    width:500px;
    text-align:center;
    margin:auto;
    padding:10px;
    box-shadow:5px 5px 15px;

}
input{
    margin:10px;

}
button{
    margin-top:30px;

        </style>
    </head>
    <body>
        <h1>welcome to on board</h1>
        <h3 style="text-decoration: none;">Temperature Conversion </h3>
        <form>
            <h2>Convertion</h2>
            <input type="number" id="user" value="0"><br>
            <input type="radio" name="temp" id="f">
            <label for="f">celsius ➡️ fahrenheit</label><br>
            <input type="radio" name="temp" id="c">
            <label for="c">fahrenheit ➡️ celcius</label><br>
            <button  type="button" id="submit" onclick="convert()">Submit</button>
            <p id="result">Result</p>
        </form>
         <p id="p"></p>
     <script >
        console.log("welcome to my world");
console.log("hunting begins from now");
//////////////////////////////////////////////
/////////////////////////////////////////////
const input=document.getElementById("user");
const c=document.getElementById("c");
const f=document.getElementById("f");
const p=document.getElementById("result");
const submit=document.getElementById("submit");
let temp;
function convert(){
    temp=Number(input.value);
   if(c.checked){
     temp=(temp-32)*5/9;
     p.textContent=`The result is ${temp}`;
   }
   else if(f.checked){
      temp=temp*9/5+32;
      p.textContent=`The result is ${temp}`;
   }
   else{
    p.textContent="Select the conversion type";
   }
}
     </script>
    </body>
</html>
