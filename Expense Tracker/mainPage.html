<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Main Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- fontawesome code  -->
         <script src="https://kit.fontawesome.com/c845a0699c.js" crossorigin="anonymous"></script>
    <!-- css linking  -->
    <link rel="stylesheet" href="mainPage.css">
</head>

<body>
    <h1>Express Tracker <i class="fa-solid fa-wallet" style="color: #FFD43B;"></i></h1>
    <!-- inputs  -->
    <div class="inputs">
        <!-- date -->
        <input type="date" id="date">
        <!-- amount  -->
        <input type="text" placeholder="Amount" id="amount">
        <!-- selection  -->
        <select name="" id="selection">
            <option value="Transaction">Transaction Type</option>
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
        </select>
        <button id="addButton">+</button>
    </div>
    <!-- cards  -->
    <div class="cards">
        <!-- card 1 -->
        <div class="card">
            <p>Total Income</p>
            <span class="rupee totalIncome"><i class="fa-solid fa-indian-rupee-sign" style="color: #FFD43B;"></i>0</span>
        </div>
        <div class="card">
            <p>Total Expense</p>
            <span class="rupee totalExpense"><i class="fa-solid fa-indian-rupee-sign" style="color: #FFD43B;"></i>0</span>
        </div>
        <div class="card">
            <p>Balance</p>
            <span class="rupee totalBalance"><i class="fa-solid fa-indian-rupee-sign" style="color: #FFD43B;"></i>0</span>
        </div>
    </div>
    <!-- table  -->
     <table>
        <tr>
            <th>Amount</th>
            <th>Transaction Type</th>
            <th>Date</th>
            <th>Action</th>
        </tr>
     </table>
    <!-- boostrap js code  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
        <!-- my js code  -->
         <script src="mainPage.js"></script>
</body>
</html>
