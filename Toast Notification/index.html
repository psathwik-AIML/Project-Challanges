<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notification</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/c845a0699c.js" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Toast Notification</h1>
    <!-- all buttons  -->
    <div class="buttons">
        <button onclick='show(successMessage)'>Success</button>
        <button onclick='show(errorMessage)'>Error</button>
        <button onclick='show(invalidMessage)'>Invalid</button>
    </div>
    <!-- toast box  -->
     <div class="box">

     </div>
</body>
<script src="script.js"></script>
</html>
